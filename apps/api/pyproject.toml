[project]
name = "sageboard-api"
version = "0.1.0"
description = "Sageboard backend — FastAPI service hosting the agentic analysis runtime."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.160",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-multipart>=0.0.33",
    "argon2-cffi>=25.1",
    "pyjwt>=2.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit security rules (eval/exec/subprocess/etc.)
    "ASYNC",         # async pitfalls
    "C4", "SIM", "RET", "PL", "RUF",
]
ignore = [
    "PLR0913",       # many args is fine for settings/factories
    "E501",          # ruff format owns line length; long user-facing messages stay unsplit
]
# User-facing messages use real typography on purpose (’ – × − « »).
allowed-confusables = ["’", "–", "×", "−", "«", "»"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S608", "ASYNC240"]  # asserts, fake secrets, magic values, test SQL, tmp files
# The synthetic generator is a table of business probabilities; naming each one adds noise.
# Its RNG is seeded for reproducibility, never used for security.
"app/seed/ecommerce.py" = ["PLR2004", "S311"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL (DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs ORM code inside greenlets; without this, coverage
# under-reports everything that executes during a database round trip.
concurrency = ["greenlet", "thread"]
