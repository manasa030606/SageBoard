name: ci-api

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "infra/**", ".github/workflows/ci-api.yml"]
  pull_request:
    paths: ["apps/api/**", "infra/**", ".github/workflows/ci-api.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sageboard
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # CI-only throwaway credentials for an ephemeral database.
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: ci-postgres
      POSTGRES_DB: sageboard
      POSTGRES_USER: postgres
      SAGEBOARD_OWNER_PASSWORD: ci-owner
      SAGEBOARD_APP_PASSWORD: ci-app
      SAGEBOARD_INGEST_PASSWORD: ci-ingest
      SAGEBOARD_EXECUTOR_PASSWORD: ci-executor
      ENV: test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://sageboard_owner:ci-owner@localhost:5432/sageboard
      SAGEBOARD_TEST_DATABASE_URL: postgresql+asyncpg://sageboard_app:ci-app@localhost:5432/sageboard
      SAGEBOARD_TEST_EXECUTOR_DATABASE_URL: postgresql+asyncpg://sageboard_executor:ci-executor@localhost:5432/sageboard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Bootstrap database roles
        run: bash ../../infra/postgres/init/001_roles.sh
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Tests (unit + integration)
        run: uv run pytest --cov --cov-report=term-missing
