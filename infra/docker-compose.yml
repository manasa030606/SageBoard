# Local development / test database for Sageboard.
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
name: sageboard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sageboard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      SAGEBOARD_OWNER_PASSWORD: ${SAGEBOARD_OWNER_PASSWORD:?set in infra/.env}
      SAGEBOARD_APP_PASSWORD: ${SAGEBOARD_APP_PASSWORD:?set in infra/.env}
      SAGEBOARD_INGEST_PASSWORD: ${SAGEBOARD_INGEST_PASSWORD:?set in infra/.env}
      SAGEBOARD_EXECUTOR_PASSWORD: ${SAGEBOARD_EXECUTOR_PASSWORD:?set in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # bound to localhost only
    volumes:
      - sageboard_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sageboard_pgdata:
